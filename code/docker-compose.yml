services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: pethotel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pethotel"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # หน้าเว็บดูอีเมลที่ระบบส่ง

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pethotel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_MAIL_HOST: mail
      SPRING_MAIL_PORT: 1025
      APP_UPLOAD_DIR: /app/uploads
      APP_REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-change-me-before-deploy}
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB
      SPRINGDOC_SWAGGERUI_CSRF_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  db-data:
  uploads: