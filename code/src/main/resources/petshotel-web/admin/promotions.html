<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetsHotel Admin</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="index.html">🐾 PetsHotel Admin</a>
    <div class="top-actions">
      <a class="btn btn-small" href="../index.html">ดูหน้าลูกค้า</a>
      <span>ผู้ดูแลระบบ</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <a href="index.html">▦ ภาพรวม</a>
      <a href="bookings.html">▤ จัดการการจอง</a>
      <a href="rooms.html">▣ จัดการห้องพัก</a>
      <a href="pets.html">♧ สัตว์เลี้ยง</a>
      <a href="services.html">✿ บริการเสริม</a>
      <a href="promotions.html">◇ โปรโมชัน</a>
      <a href="reports.html">▤ รายงานการดูแล</a>
      <a href="users.html">♙ สมาชิก</a>
      <a href="settings.html">⚙ ตั้งค่า</a>
    </aside>

    <main class="content">
        <div class="section-title">
            <h1>โปรโมชัน</h1>
            <button class="btn btn-primary" type="button">+ เพิ่มโปรโมชัน</button>
            </div>

            <div class="panel table-scroll">
            <table class="table">
                <thead>
                <tr>
                    <th>โค้ด</th>
                    <th>ส่วนลด</th>
                    <th>วันหมดอายุ</th>
                    <th>สถานะ</th>
                    <th>จัดการ</th>
                </tr>
                </thead>

                <tbody>
                <tr>
                    <td>WELCOME10</td>
                    <td>10%</td>
                    <td>31 ธ.ค. 2026</td>
                    <td><span class="badge">ใช้งานได้</span></td>
                    <td>
                    <button class="btn btn-small">แก้ไข</button>
                    <button class="btn btn-small">ปิดใช้</button>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>

            <div class="section-title">
            <h2>ฟอร์มโปรโมชัน</h2>
            </div>

            <form class="panel grid cols-2">
            <label class="field">รหัสโปรโมชัน<input name="code" required></label>

            <label class="field">
                ประเภทส่วนลด
                <select name="discountType">
                <option value="PERCENT">เปอร์เซ็นต์</option>
                <option value="FIXED">จำนวนเงิน</option>
                </select>
            </label>

            <label class="field">
                มูลค่าส่วนลด
                <input type="number" name="discountValue" min="1" required>
            </label>

            <label class="field">
                วันหมดอายุ
                <input type="date" name="expiresAt" required>
            </label>

            <button class="btn btn-primary" type="submit">บันทึกโปรโมชัน</button>
            </form>
    </main>
  </div>
</body>
</html>
