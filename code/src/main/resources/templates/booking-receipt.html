<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title th:text="${'ใบเสร็จ ' + receipt.receiptNumber + ' - PetsHotel'}">
    ใบเสร็จ · PetsHotel
  </title>

  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/booking-receipt.css}">
  <script defer th:src="@{/js/booking-receipt.js}"></script>
</head>

<body class="receipt-page"
      th:classappend="${staffView} ? 'admin' : ''">

  <header th:replace="${staffView}
    ? ~{fragments/layout :: admin-topbar}
    : ~{fragments/layout :: topbar}">
  </header>

  <div class="layout">
    <aside th:replace="${staffView}
      ? ~{fragments/layout :: admin-sidebar}
      : ~{fragments/layout :: sidebar}">
    </aside>
    
    <main class="content">
      <div class="receipt-actions">
        <a class="btn" th:href="@{${backUrl}}">
          กลับ
        </a>

        <button id="print-receipt"
                class="btn btn-primary"
                type="button"
                hidden>
          พิมพ์ / บันทึก PDF
        </button>
      </div>

      <noscript>
        <p class="receipt-print-help">
          กด Ctrl + P เพื่อพิมพ์หรือบันทึกใบเสร็จเป็น PDF
        </p>
      </noscript>

      <article id="receipt-document"
               class="panel receipt-document"
               aria-labelledby="receipt-heading">

        <header class="receipt-heading">
          <p class="receipt-brand">PetsHotel</p>
          <h1 id="receipt-heading">ใบเสร็จรับเงิน</h1>
          <p>หลักฐานการรับชำระเงินค่าบริการ</p>
        </header>

        <dl class="receipt-info">
          <dt>เลขที่ใบเสร็จ</dt>
          <dd th:text="${receipt.receiptNumber}"></dd>

          <dt>วันที่ออก</dt>
          <dd>
            <span th:text="${#temporals.format(
              receipt.issuedAt, 'dd/MM/yyyy HH:mm'
            )}"></span>
            <small class="muted">(เวลาไทย)</small>
          </dd>

          <dt>เลขที่การจอง</dt>
          <dd th:text="${booking.id}"></dd>

          <dt>ชื่อลูกค้า</dt>
          <dd th:text="${receipt.customerName != null
            and !#strings.isEmpty(receipt.customerName)
              ? receipt.customerName
              : 'ไม่มีข้อมูลชื่อในใบเสร็จเดิม'}">
          </dd>

          <dt>รหัสผู้จอง</dt>
          <dd th:text="${booking.userId}"></dd>

          <dt>วันเข้าพัก</dt>
          <dd th:text="${#temporals.format(
            booking.checkInDate, 'dd/MM/yyyy'
          )}"></dd>

          <dt>วันออก</dt>
          <dd th:text="${#temporals.format(
            booking.checkOutDate, 'dd/MM/yyyy'
          )}"></dd>

          <dt>โปรโมชันตอนจอง</dt>
          <dd th:text="${booking.promotionName != null
            ? booking.promotionName : 'ไม่ใช้โปรโมชัน'}"></dd>
        </dl>

        <table class="table receipt-table">
          <thead>
            <tr>
              <th scope="col">รายการ</th>
              <th scope="col" class="receipt-money">
                จำนวนเงิน (บาท)
              </th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>ค่าห้องพัก</td>
              <td class="receipt-money"
                  th:text="${receipt.roomAmount != null
                    ? #numbers.formatDecimal(
                        receipt.roomAmount, 1, 'COMMA', 2, 'POINT'
                      )
                    : 'ไม่มีข้อมูล'}"></td>
            </tr>

            <tr>
              <td>ค่าบริการเสริม</td>
              <td class="receipt-money"
                  th:text="${receipt.serviceAmount != null
                    ? #numbers.formatDecimal(
                        receipt.serviceAmount, 1, 'COMMA', 2, 'POINT'
                      )
                    : 'ไม่มีข้อมูล'}"></td>
            </tr>

            <tr>
              <td>ค่าธรรมเนียมเพิ่มเติม</td>
              <td class="receipt-money"
                  th:text="${receipt.surchargeAmount != null
                    ? #numbers.formatDecimal(
                        receipt.surchargeAmount, 1, 'COMMA', 2, 'POINT'
                      )
                    : 'ไม่มีข้อมูล'}"></td>
            </tr>

            <tr>
              <td>ส่วนลด</td>
              <td class="receipt-money"
                  th:text="${receipt.discountAmount != null
                    ? #numbers.formatDecimal(
                        receipt.discountAmount, 1, 'COMMA', 2, 'POINT'
                      )
                    : 'ไม่มีข้อมูล'}"></td>
            </tr>
          </tbody>

          <tfoot>
            <tr>
              <th scope="row">รับชำระแล้ว</th>
              <td class="receipt-money"
                  th:text="${receipt.totalAmount != null
                    ? #numbers.formatDecimal(
                        receipt.totalAmount, 1, 'COMMA', 2, 'POINT'
                      )
                    : 'ไม่มีข้อมูล'}"></td>
            </tr>
          </tfoot>
        </table>

        <p class="receipt-note">
          ขอบคุณที่ใช้บริการ PetsHotel
        </p>
      </article>
    </main>
  </div>
</body>
</html>
