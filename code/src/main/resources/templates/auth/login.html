<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1>🐾 เข้าสู่ระบบ</h1>
      <p class="auth-subtitle">ยินดีต้อนรับกลับสู่ PetsHotel</p>

      <p th:if="${param.registered}" class="auth-notice auth-notice-success">สมัครสมาชิกสำเร็จ กรุณาเข้าสู่ระบบ</p>
      <p th:if="${loginError}" class="auth-notice auth-notice-error" th:text="${loginError}">อีเมลหรือรหัสผ่านไม่ถูกต้อง</p>
      <p th:if="${param.logout}" class="auth-notice auth-notice-info">ออกจากระบบแล้ว</p>

      <form class="auth-form" th:action="@{/login}" method="post">
        <label class="field">
          อีเมล
          <input type="email" name="username" required autofocus>
        </label>
        <label class="field">
          รหัสผ่าน
          <input type="password" name="password" required>
        </label>
        <button class="btn btn-primary" type="submit">เข้าสู่ระบบ</button>
      </form>

      <p class="auth-footer">ยังไม่มีบัญชี? <a th:href="@{/register}">สมัครสมาชิก</a></p>
    </section>
  </main>
</body>
</html>
