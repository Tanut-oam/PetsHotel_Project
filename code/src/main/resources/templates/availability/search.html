<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ค้นหาห้องว่าง | PetStay</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<script th:src="@{/js/date-range.js}" defer></script>
<body>
  <header th:replace="~{fragments/layout :: topbar}"></header>
  <div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>
    <main class="content">
      <h1>ค้นหาห้องว่าง</h1>


    <section class="panel">
      <form class="form-grid" th:action="@{/rooms/available}" method="get" data-date-range>
        <label class="field">
          เช็กอิน
          <input type="date" name="checkIn" th:value="${search.checkIn}" required data-check-in>
        </label>
        <label class="field">
          เช็กเอาต์
          <input type="date" name="checkOut" th:value="${search.checkOut}" required data-check-out>
        </label>
        <label class="field">
          จำนวนสัตว์เลี้ยง
          <input type="number" name="petCount" min="1" th:value="${search.petCount}" required>
        </label>
        <button class="btn btn-primary" type="submit">ค้นหา</button>
      </form>
    </section>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <section class="panel" th:if="${result != null}">
      <h2>
        ห้องว่าง
        <span th:text="${#temporals.format(result.checkIn, 'dd/MM/yyyy')}"></span> –
        <span th:text="${#temporals.format(result.checkOut, 'dd/MM/yyyy')}"></span>
        (<span th:text="${result.petCount}"></span> ตัว)
      </h2>

      <p th:if="${#lists.isEmpty(result.availableRooms)}">ไม่มีห้องว่างในช่วงวันที่เลือก</p>

      <table th:unless="${#lists.isEmpty(result.availableRooms)}">
        <thead>
          <tr>
            <th>หมายเลขห้อง</th>
            <th>ชื่อห้อง</th>
            <th>รับได้ (ตัว)</th>
            <th>ราคา/ตัว/คืน</th>
            <th>การดำเนินการ</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="room : ${result.availableRooms}">
            <td th:text="${room.roomNumber}">A101</td>
            <td th:text="${room.name}">Deluxe</td>
            <td th:text="${room.capacity}">3</td>
            <td th:text="${#numbers.formatDecimal(room.pricePerPetPerNight, 1, 'COMMA', 2, 'POINT')} + ' บาท'">500.00 บาท</td>
            <td>
              <a class="btn btn-small btn-primary"
                 th:href="@{/bookings/new(roomId=${room.id}, checkIn=${result.checkIn}, checkOut=${result.checkOut})}">จองห้องนี้</a>
            </td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
  </div>
</body>
</html>
