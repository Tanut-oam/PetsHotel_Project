<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายงานการดูแล | PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/customer-report.css}">
</head>
<body>
  <header th:replace="~{fragments/layout :: topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>รายงานการดูแลรายวัน</h1>
      </div>

      <div class="panel"
           th:if="${#lists.isEmpty(reports)}"
           role="status">
        ยังไม่มีรายงานการดูแลสำหรับการจองของคุณ
      </div>

      <div class="customer-booking-list"
           th:unless="${#lists.isEmpty(reports)}">
        <article class="panel customer-booking"
                 th:each="booking : ${bookingGroups}"
                 th:with="bookingInfo=${bookingsById[booking.key]}">

          <div class="customer-booking-header">
            <div>
              <h2 th:text="|การจอง #${booking.key}|">การจอง #1</h2>
              <p class="muted"
                 th:if="${bookingInfo != null}"
                 th:text="|เข้าพัก ${bookingInfo.checkInDate} ถึง ${bookingInfo.checkOutDate}|">
                วันที่เข้าพัก
              </p>
            </div>

            <span class="badge"
                  th:text="|${reportCountsByBooking[booking.key]} รายงาน|">
              จำนวนรายงาน
            </span>
          </div>

          <p class="customer-booking-caption"
             th:text="|สัตว์เลี้ยงที่มีรายงาน ${#maps.size(booking.value)} ตัว|">
            สัตว์เลี้ยงที่มีรายงาน
          </p>

          <div class="customer-pet-list">
            <div class="customer-pet-row"
                 th:each="petGroup : ${booking.value}"
                 th:with="latest=${petGroup.value[0]}">
              <div class="customer-pet-summary">
                <strong th:text="${latest.petName}">ชื่อสัตว์เลี้ยง</strong>
                <span class="muted"
                      th:text="|${#lists.size(petGroup.value)} รายงาน · ล่าสุด ${latest.reportDate}|">
                  จำนวนและวันที่รายงาน
                </span>
              </div>

              <a class="btn btn-primary"
                 th:href="@{/reports/pets/{bookingPetId}(bookingPetId=${petGroup.key})}"
                 th:aria-label="|ดูรายงานของ ${latest.petName} ในการจอง #${booking.key}|">
                ดูรายงาน
              </a>
            </div>
          </div>
        </article>
      </div>
    </main>
  </div>

  <footer class="footer">
    PetsHotel · บ้านหลังที่สองของเพื่อนตัวโปรด
  </footer>
</body>
</html>
