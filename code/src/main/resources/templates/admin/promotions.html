<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>โปรโมชัน | PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>โปรโมชัน</h1>
        <a class="btn btn-primary"
           th:href="@{/admin/promotions} + '#promotion-form'">
          + เพิ่มโปรโมชัน
        </a>
      </div>

      <p th:if="${message}"
         th:text="${message}"
         role="status"></p>

      <p th:if="${error}"
         th:text="${error}"
         role="alert"></p>

      <div class="panel table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th>ชื่อโปรโมชัน</th>
              <th>ส่วนลด</th>
              <th>วันหมดอายุ</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>

          <tbody>
            <tr th:if="${#lists.isEmpty(promotions)}">
              <td colspan="5">ยังไม่มีโปรโมชัน</td>
            </tr>

            <tr th:each="promotion : ${promotions}">
              <td th:text="${promotion.name}">ชื่อโปรโมชัน</td>

              <td>
                <span th:if="${promotion.type.name() == 'PERCENTAGE'}"
                      th:text="|${promotion.value}%|">
                  10%
                </span>

                <span th:if="${promotion.type.name() == 'FIXED_AMOUNT'}"
                      th:text="|฿${promotion.value}|">
                  ฿100
                </span>
              </td>

              <td th:text="${promotion.endDate}">2026-12-31</td>

              <td>
                <span th:if="${promotion.active}" class="badge">
                  เปิดใช้
                </span>

                <span th:unless="${promotion.active}"
                      class="badge badge-danger">
                  ปิดใช้
                </span>
              </td>

              <td>
                <a class="btn btn-small"
                   th:href="@{/admin/promotions(editId=${promotion.id})} + '#promotion-form'">
                  แก้ไข
                </a>

                <form class="deactivate-promotion-form"
                      th:action="@{/admin/promotions/{id}/deactivate(id=${promotion.id})}"
                      th:attr="data-name=${promotion.name}"
                      method="post"
                      style="display:inline">
                  <button class="btn btn-small"
                          type="submit"
                          th:disabled="${!promotion.active}">
                    ปิดใช้
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="section-title">
        <h2 th:text="${editingId == null ? 'เพิ่มโปรโมชัน' : 'แก้ไขโปรโมชัน'}">
          ฟอร์มโปรโมชัน
        </h2>
      </div>

      <form id="promotion-form"
            class="panel grid cols-2"
            th:action="@{/admin/promotions}"
            th:object="${promotionForm}"
            method="post">

        <input th:if="${editingId != null}"
               type="hidden"
               name="id"
               th:value="${editingId}">

        <div th:if="${#fields.hasAnyErrors()}" role="alert">
          <ul>
            <li th:each="formError : ${#fields.allErrors()}"
                th:text="${formError}">
              ข้อมูลไม่ถูกต้อง
            </li>
          </ul>
        </div>

        <label class="field">
          ชื่อโปรโมชัน
          <input th:field="*{name}" required>
        </label>

        <label class="field">
          ประเภทส่วนลด
          <select th:field="*{type}" required>
            <option value="PERCENTAGE">เปอร์เซ็นต์</option>
            <option value="FIXED_AMOUNT">จำนวนเงิน</option>
          </select>
        </label>

        <label class="field">
          มูลค่าส่วนลด
          <input type="number"
                 th:field="*{discountValue}"
                 min="0.01"
                 step="0.01"
                 required>
        </label>

        <label class="field">
          วันเริ่มต้น
          <input type="date" th:field="*{startDate}" required>
        </label>

        <label class="field">
          วันสิ้นสุด
          <input type="date" th:field="*{endDate}" required>
        </label>

        <label class="field">
          <input type="checkbox" th:field="*{active}">
          เปิดใช้โปรโมชัน
        </label>

        <button class="btn btn-primary"
                type="submit"
                th:text="${editingId == null ? 'บันทึกโปรโมชัน' : 'บันทึกการแก้ไข'}">
          บันทึกโปรโมชัน
        </button>

        <a class="btn btn-small" th:href="@{/admin/promotions}">
          ล้างฟอร์ม / ยกเลิก
        </a>
      </form>
    </main>
  </div>

  <script th:src="@{/js/admin-promotions.js}" defer></script>
</body>
</html>
