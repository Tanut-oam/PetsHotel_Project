<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
        <h1>สัตว์เลี้ยงในระบบ</h1>
            <div class="toolbar">
            <label class="field">
                ค้นหาสัตว์เลี้ยงหรือเจ้าของ
                <input type="search" id="pet-search" placeholder="ค้นหาสัตว์เลี้ยงหรือเจ้าของ">
            </label>

            <label class="field">
                ประเภท
                <select id="pet-type-filter">
                  <option value="ALL">ทั้งหมด</option>
                  <option value="DOG">สุนัข</option>
                  <option value="CAT">แมว</option>
                  <option value="OTHER">สัตว์ชนิดอื่น</option>
                </select>
            </label>
            </div>

            <div class="panel table-scroll">
            <table class="table">
                <thead>
                <tr>
                    <th>ชื่อ</th>
                    <th>เจ้าของ</th>
                    <th>ประเภท</th>
                    <th>สายพันธุ์</th>
                    <th>อายุ</th>
                    <th>น้ำหนัก</th>
                    <th>ข้อควรระวัง</th>
                </tr>
                </thead>

                <tbody>
                <tr>
                    <td>Mochi</td>
                    <td>คุณกานต์</td>
                    <td>สุนัข</td>
                    <td>ชิบะอินุ</td>
                    <td>2 ปี</td>
                    <td>12.5 กก.</td>
                    <td>แพ้อาหารทะเล</td>
                </tr>

                <tr>
                    <td>Lily</td>
                    <td>คุณเมย์</td>
                    <td>แมว</td>
                    <td>บริติชช็อตแฮร์</td>
                    <td>4 ปี</td>
                    <td>4.2 กก.</td>
                    <td>—</td>
                </tr>
                </tbody>
            </table>
            </div>
    </main>
  </div>
</body>
</html>
