<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บริการเสริม | PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>บริการเสริม</h1>
        <a class="btn btn-primary"
           th:href="@{/admin/services} + '#extra-service-form'">
          + เพิ่มบริการ
        </a>
      </div>

      <p th:if="${message}"
         th:text="${message}"
         role="status"></p>

      <p th:if="${error}"
         th:text="${error}"
         role="alert"></p>

      <div class="panel table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th>ชื่อบริการ</th>
              <th>ราคา</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>

          <tbody>
            <tr th:if="${#lists.isEmpty(extraServices)}">
              <td colspan="4">ยังไม่มีบริการเสริม</td>
            </tr>

            <tr th:each="service : ${extraServices}">
              <td th:text="${service.name}">ชื่อบริการ</td>
              <td th:text="|฿${service.price}|">฿0.00</td>

              <td>
                <span th:if="${service.active}" class="badge">
                  เปิดใช้
                </span>

                <span th:unless="${service.active}"
                      class="badge badge-danger">
                  ปิดใช้
                </span>
              </td>

              <td>
                <a class="btn btn-small"
                   th:href="@{/admin/services(editId=${service.id})} + '#extra-service-form'">
                  แก้ไข
                </a>

                <form class="deactivate-extra-service-form"
                      th:action="@{/admin/services/{id}/deactivate(id=${service.id})}"
                      th:attr="data-name=${service.name}"
                      method="post"
                      style="display:inline">
                  <button class="btn btn-small"
                          type="submit"
                          th:disabled="${!service.active}">
                    ปิดใช้
                  </button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="section-title">
        <h2 th:text="${editingId == null ? 'เพิ่มบริการเสริม' : 'แก้ไขบริการเสริม'}">
          ฟอร์มบริการเสริม
        </h2>
      </div>

      <form id="extra-service-form"
            class="panel grid cols-2"
            th:action="@{/admin/services}"
            th:object="${serviceForm}"
            method="post">

        <input th:if="${editingId != null}"
               type="hidden"
               name="id"
               th:value="${editingId}">

        <div th:if="${#fields.hasAnyErrors()}" role="alert">
          <ul>
            <li th:each="formError : ${#fields.allErrors()}"
                th:text="${formError}">
              ข้อมูลไม่ถูกต้อง
            </li>
          </ul>
        </div>

        <label class="field">
          ชื่อบริการ
          <input th:field="*{name}" required>
        </label>

        <label class="field">
          รายละเอียด
          <textarea th:field="*{description}"></textarea>
        </label>

        <label class="field">
          ราคา
          <input type="number"
                 th:field="*{price}"
                 min="0"
                 step="0.01"
                 required>
        </label>

        <label class="field">
          <input type="checkbox" th:field="*{active}">
          เปิดใช้บริการ
        </label>

        <button class="btn btn-primary"
                type="submit"
                th:text="${editingId == null ? 'บันทึกบริการ' : 'บันทึกการแก้ไข'}">
          บันทึกบริการ
        </button>

        <a class="btn btn-small" th:href="@{/admin/services}">
          ล้างฟอร์ม / ยกเลิก
        </a>
      </form>
    </main>
  </div>

  <script th:src="@{/js/admin-extra-services.js}" defer></script>
</body>
</html>
