<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetsHotel Admin</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="admin">
  <header class="topbar">
    <a class="brand" href="index.html">🐾 PetsHotel Admin</a>
    <div class="top-actions">
      <a class="btn btn-small" href="../index.html">ดูหน้าลูกค้า</a>
      <span>ผู้ดูแลระบบ</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <a class="active" th:href="@{/admin}">▦ ภาพรวม</a>
      <a href="bookings.html">▤ จัดการการจอง</a>
      <a href="rooms.html">▣ จัดการห้องพัก</a>
      <a href="pets.html">♧ สัตว์เลี้ยง</a>
      <a th:href="@{/admin/services}">✿ บริการเสริม</a>
      <a th:href="@{/admin/promotions}">◇ โปรโมชัน</a>
      <a href="reports.html">▤ รายงานการดูแล</a>
      <a href="users.html">♙ สมาชิก</a>
      <a href="settings.html">⚙ ตั้งค่า</a>
    </aside>

    <main class="content">
        <div class="section-title">
            <h1>บริการเสริม</h1>
            <a id="add-extra-service" class="btn btn-primary" href="#extra-service-form">+ เพิ่มบริการ</a>
            </div>

            <div class="panel table-scroll">
            <table class="table">
                <thead>
                <tr>
                    <th>ชื่อบริการ</th>
                    <th>ราคา</th>
                    <th>สถานะ</th>
                    <th>จัดการ</th>
                </tr>
                </thead>

                <tbody>
                  <tr th:if="${#lists.isEmpty(extraServices)}">
                      <td colspan="4">ยังไม่มีบริการเสริม</td>
                  </tr>

                  <tr th:each="service : ${extraServices}">
                      <td th:text="${service.name}">ชื่อบริการ</td>

                      <td th:text="|฿${service.price}|">฿0.00</td>

                      <td>
                          <span th:if="${service.active}" class="badge">
                              เปิดใช้
                          </span>
                          <span th:unless="${service.active}"
                                class="badge badge-danger">
                              ปิดใช้
                          </span>
                      </td>

                      <td>
                          <button class="btn btn-small edit-extra-service"
                                  type="button"
                                  th:attr="data-service-id=${service.id}">
                              แก้ไข
                          </button>
                          <button class="btn btn-small deactivate-extra-service"
                                  type="button"
                                  th:attr="data-service-id=${service.id}"
                                  th:disabled="${!service.active}">
                              ปิดใช้
                          </button>
                      </td>
                  </tr>
              </tbody>
            </table>
            </div>

            <div class="section-title">
            <h2>ฟอร์มบริการเสริม</h2>
            </div>

            <form id="extra-service-form" class="panel grid cols-2">
              <label class="field">
                  ชื่อบริการ
                  <input name="name" required>
              </label>

              <label class="field">
                  รายละเอียด
                  <textarea name="description"></textarea>
              </label>

              <label class="field">
                  ราคา
                  <input type="number"
                        name="price"
                        min="0"
                        step="0.01"
                        required>
              </label>

              <label class="field">
                  <input type="checkbox" name="active" checked>
                  เปิดใช้บริการ
              </label>

              <p id="extra-service-message"
                role="status"
                aria-live="polite"></p>

              <button class="btn btn-primary" type="submit" disabled>
                  บันทึกบริการ
              </button>
          </form>
    </main>
  </div>

  <script th:src="@{/js/admin-extra-services.js}" defer></script>

</body>
</html>
