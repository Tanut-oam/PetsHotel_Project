<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>รายงานการดูแล</h1>
      </div>

      <div th:if="${message}"
           class="flash-notice flash-success"
           role="status">
        <span class="flash-icon" aria-hidden="true">✓</span>
        <span th:text="${message}">บันทึกสำเร็จ</span>
      </div>

      <div th:if="${error}"
           class="flash-notice flash-error"
           role="alert">
        <span class="flash-icon" aria-hidden="true">!</span>
        <span th:text="${error}">ไม่สามารถบันทึกได้</span>
      </div>

      <section aria-labelledby="create-report-heading">
        <div class="section-title">
          <h2 id="create-report-heading">บันทึกรายงานการดูแล</h2>
        </div>

        <div class="panel"
             th:if="${#lists.isEmpty(bookingPetOptions)}">
          ยังไม่มีสัตว์ในการจองที่พร้อมให้บันทึกรายงาน
        </div>

        <form class="panel grid cols-2"
              th:unless="${#lists.isEmpty(bookingPetOptions)}"
              th:action="@{/admin/reports}"
              method="post">

          <label class="field">
            สัตว์ในการจอง
            <select name="bookingPetId" required>
              <option value="" selected disabled>เลือกสัตว์ในการจอง</option>
              <option th:each="option : ${bookingPetOptions}"
                      th:value="${option.bookingPetId}"
                      th:text="|การจอง #${option.bookingId} · ${option.petName} (${option.ownerName}) · ${option.checkInDate} ถึง ${option.checkOutDate}|">
                สัตว์ในการจอง
              </option>
            </select>
          </label>

          <label class="field">
            วันที่รายงาน
            <input type="date" name="reportDate" required>
          </label>

          <label class="field">
            อาหารมื้อเช้า
            <textarea name="feedingMorning"></textarea>
          </label>

          <label class="field">
            อาหารมื้อเย็น
            <textarea name="feedingEvening"></textarea>
          </label>

          <label class="field">
            เวลาเดินเล่น (นาที)
            <input type="number"
                   name="walkingMinutes"
                   min="0"
                   step="1">
          </label>

          <label class="field">
            การดูแลความสะอาด
            <textarea name="grooming"></textarea>
          </label>

          <label class="field">
            อารมณ์
            <textarea name="mood"></textarea>
          </label>

          <label class="field">
            ข้อมูลสุขภาพ
            <textarea name="healthNote"></textarea>
          </label>

          <label class="field">
            หมายเหตุเพิ่มเติม
            <textarea name="generalNote"></textarea>
          </label>

          <div>
            <button class="btn btn-primary" type="submit">
              บันทึกรายงาน
            </button>
          </div>
        </form>
      </section>

      <div class="section-title">
        <h2>รายงานที่บันทึกแล้ว</h2>
      </div>

      <div class="panel"
           th:if="${#lists.isEmpty(reports)}"
           role="status">
        ยังไม่มีรายงานการดูแลในระบบ
      </div>

      <div class="panel table-scroll"
           th:unless="${#lists.isEmpty(reports)}">
        <table class="table">
          <thead>
            <tr>
              <th>วันที่</th>
              <th>การจอง</th>
              <th>สัตว์เลี้ยง</th>
              <th>อาหาร</th>
              <th>เดินเล่น</th>
              <th>ความสะอาด</th>
              <th>อารมณ์</th>
              <th>สุขภาพ</th>
              <th>หมายเหตุ</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="report : ${reports}">
              <td th:text="${report.reportDate}">—</td>
              <td th:text="${'#' + report.bookingId}">—</td>
              <td th:text="${report.petName}">—</td>
              <td>
                <div>
                  เช้า:
                  <span th:text="${#strings.isEmpty(report.feedingMorning) ? '—' : report.feedingMorning}">—</span>
                </div>
                <div>
                  เย็น:
                  <span th:text="${#strings.isEmpty(report.feedingEvening) ? '—' : report.feedingEvening}">—</span>
                </div>
              </td>
              <td th:text="${report.walkingMinutes == null ? '—' : report.walkingMinutes + ' นาที'}">—</td>
              <td th:text="${#strings.isEmpty(report.grooming) ? '—' : report.grooming}">—</td>
              <td th:text="${#strings.isEmpty(report.mood) ? '—' : report.mood}">—</td>
              <td th:text="${#strings.isEmpty(report.healthNote) ? '—' : report.healthNote}">—</td>
              <td th:text="${#strings.isEmpty(report.generalNote) ? '—' : report.generalNote}">—</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
