<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายงานการดูแล | PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/admin-reports.css}">
</head>
<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>
  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>
    <main class="content">
      <div class="section-title"><h1>รายงานการดูแล</h1></div>
      <div th:if="${message}" class="flash-notice flash-success" th:text="${message}" role="status"></div>
      <div th:if="${error}" class="flash-notice flash-error" th:text="${error}" role="alert"></div>

      <section aria-labelledby="care-bookings-heading">
        <div class="section-title">
          <h2 id="care-bookings-heading">การจองและรายงานการดูแล</h2>
        </div>
        <div class="panel" th:if="${reportableBookings.isEmpty()}" role="status">
          ยังไม่มีการจองที่พร้อมบันทึกรายงาน
        </div>
        <div class="report-booking-list" th:unless="${reportableBookings.isEmpty()}">
          <article class="panel report-booking" th:each="booking : ${reportableBookings}">
            <div class="report-booking-info">
              <h3 th:text="|การจอง #${booking.key}|">การจอง #1</h3>
              <span th:text="|เจ้าของ: ${booking.value[0].ownerName}|">เจ้าของ</span>
              <span th:text="|เข้าพัก ${booking.value[0].checkInDate} ถึง ${booking.value[0].checkOutDate}|">วันที่เข้าพัก</span>
              <span th:text="|${#lists.size(booking.value)} ตัว|">จำนวนสัตว์</span>
            </div>
            <div class="report-pet-list">
              <a class="report-pet-button"
                 th:each="pet : ${booking.value}"
                 th:href="@{/admin/reports/pets/{id}(id=${pet.bookingPetId})}"
                 th:attr="aria-label=|ดูรายละเอียดและรายงานของ ${pet.petName}|">
                <strong th:text="${pet.petName}">ชื่อสัตว์</strong>
                <span th:text="${reportsByBookingPet[pet.bookingPetId] == null ? 'ยังไม่มีรายงาน' : #lists.size(reportsByBookingPet[pet.bookingPetId]) + ' รายงาน'}">จำนวนรายงาน</span>
              </a>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
