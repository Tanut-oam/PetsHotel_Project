<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมาชิก | PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
      <h1>สมาชิก</h1>

      <div class="panel table-scroll">
        <table class="table">
          <thead>
            <tr>
              <th>ชื่อ</th>
              <th>อีเมล</th>
              <th>เบอร์โทร</th>
              <th>บทบาท</th>
            </tr>
          </thead>

          <tbody>
            <tr th:if="${#lists.isEmpty(users)}">
              <td colspan="4">ยังไม่มีสมาชิก</td>
            </tr>

            <tr th:each="user : ${users}">
              <td th:text="${user.fullName()}">ตัวอย่างผู้ใช้</td>
              <td th:text="${user.email}">demo@petshotel.test</td>
              <td th:text="${user.phoneNumber}">0812345678</td>
              <td>
                <span class="badge"
                      th:if="${user.role.name() == 'CUSTOMER'}">ลูกค้า</span>
                <span class="badge badge-warning"
                      th:if="${user.role.name() == 'STAFF'}">พนักงาน</span>
                <span class="badge badge-danger"
                      th:if="${user.role.name() == 'ADMIN'}">แอดมิน</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
