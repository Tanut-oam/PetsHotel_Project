<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
        <h1>ภาพรวม</h1>
            <div class="stats">
              <div class="stat">
                <span>ยอดรับเงินเดือนนี้</span>
                <strong
                  th:text="|฿${#numbers.formatDecimal(dashboard.revenueThisMonth, 1, 'COMMA', 2, 'POINT')}|">
                  ฿0.00
                </strong>
              </div>

              <div class="stat">
                <span>การจองเดือนนี้ (ไม่รวมยกเลิก)</span>
                <strong th:text="${dashboard.bookingsThisMonth}">0</strong>
              </div>

              <div class="stat">
                <span>ห้องว่างคืนนี้</span>
                <strong th:text="${dashboard.availableRoomCountToday}">0</strong>
              </div>

              <div class="stat">
                <span>สัตว์ที่กำลังเข้าพัก</span>
                <strong th:text="${dashboard.checkedInPets}">0</strong>
              </div>
            </div>

            <div class="section-title">
            <h2>การจองล่าสุด</h2>
            <a th:href="@{/admin/bookings}">ดูทั้งหมด →</a>
            </div>

            <div class="panel table-scroll">
            <table class="table">
                <thead>
                <tr>
                    <th>เลขที่</th>
                    <th>ลูกค้า</th>
                    <th>สัตว์เลี้ยง</th>
                    <th>ห้อง</th>
                    <th>สถานะ</th>
                </tr>
                </thead>

                <tbody>
                  <tr th:if="${#lists.isEmpty(dashboard.recentBookings)}">
                    <td colspan="5">ยังไม่มีรายการจอง</td>
                  </tr>

                  <tr th:each="booking : ${dashboard.recentBookings}">
                    <td th:text="|#${booking.id}|">#0</td>

                    <td th:text="${booking.customerName}">ชื่อลูกค้า</td>

                    <td th:text="${#strings.listJoin(booking.petNames, ', ')}">
                      ชื่อสัตว์เลี้ยง
                    </td>

                    <td th:text="${booking.roomNumber}">หมายเลขห้อง</td>

                    <td th:switch="${booking.status.name()}">
                      <span th:case="'PENDING'" class="badge badge-warning">
                        รอยืนยัน
                      </span>
                      <span th:case="'CONFIRMED'" class="badge">
                        ยืนยันแล้ว
                      </span>
                      <span th:case="'CHECKED_IN'" class="badge">
                        เข้าพักแล้ว
                      </span>
                      <span th:case="'CHECKED_OUT'" class="badge">
                        เช็กเอาต์แล้ว
                      </span>
                      <span th:case="'CANCELLED'" class="badge badge-danger">
                        ยกเลิกแล้ว
                      </span>
                      <span th:case="*" class="badge">ไม่ทราบสถานะ</span>
                    </td>
                  </tr>
                </tbody>
            </table>
            </div>
    </main>
  </div>
</body>
</html>
