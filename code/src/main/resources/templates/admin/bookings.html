<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการการจอง · PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script defer th:src="@{/js/booking-ui.js}"></script>
</head>
<body>
  <header th:replace="~{fragments/layout :: topbar}"></header>
  <div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
      <h1>จัดการการจอง</h1>

      <p th:if="${message}" th:text="${message}" role="status"></p>
      <p th:if="${error}" th:text="${error}" role="alert"></p>

      <section th:replace="~{fragments/booking-table :: table(${bookings}, true)}">
      </section>
    </main>
  </div>
</body>
</html>
