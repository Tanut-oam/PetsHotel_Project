<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการการจอง · PetsHotel</title>

  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script defer th:src="@{/js/booking-ui.js}"></script>

  <style>
    [hidden] { display: none !important; }
    dialog {
      border: 0;
      border-radius: 12px;
      padding: 24px;
      width: min(520px, 90vw);
    }
    dialog::backdrop { background: rgb(0 0 0 / 40%); }
    .booking-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .booking-actions form { margin: 0; }
  </style>
</head>
<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content" data-booking-page="staff">
      <h1>จัดการการจอง</h1>

      <div class="booking-page-alert is-success"
            th:if="${message}"
            role="status">
          <span aria-hidden="true">✓</span>
          <p th:text="${message}"></p>
        </div>

        <div class="booking-page-alert is-error"
            th:if="${error}"
            role="alert">
          <span aria-hidden="true">!</span>
          <p th:text="${error}"></p>
        </div>

      <div class="toolbar">
        <label class="field">
          ค้นหาการจอง
          <input id="booking-search" type="search"
                 placeholder="เลขที่ ผู้จอง ห้อง หรือสัตว์เลี้ยง">
        </label>

        <label class="field">
          สถานะ
          <select id="booking-filter">
            <option value="">ทั้งหมด</option>
            <option value="PENDING">รอยืนยัน</option>
            <option value="CONFIRMED">ยืนยันแล้ว</option>
            <option value="CHECKED_IN">เข้าพักแล้ว</option>
            <option value="CHECKED_OUT">เช็กเอาต์แล้ว</option>
            <option value="CANCELLED">ยกเลิกแล้ว</option>
          </select>
        </label>
      </div>

      <p id="booking-count" role="status"
         th:text="${'ทั้งหมด ' + #lists.size(bookings) + ' รายการ'}"></p>

      <div class="panel table-scroll admin-bookings-panel">
        <table class="table admin-bookings-table">
          <thead>
            <tr>
              <th>การจอง</th>
              <th>ห้องพักและสัตว์เลี้ยง</th>
              <th>ช่วงวันเข้าพัก</th>
              <th>สถานะ</th>
              <th>ยอดรวม</th>
              <th>ดำเนินการ</th>
            </tr>
          </thead>

          <tbody id="booking-rows">
            <tr th:each="booking : ${bookings}"
                data-booking-row
                th:attr="data-status=${booking.status.name()}"
                th:classappend="${booking.status.name() == 'CANCELLED'}
                  ? 'booking-row-cancelled'
                  : ''">

              <!-- เลขที่การจองและผู้จอง -->
              <td data-detail-label="การจอง">
                <div class="admin-booking-primary">
                  <strong>
                    การจอง #
                    <span th:text="${booking.id}">1</span>
                  </strong>

                  <small>
                    รหัสผู้จอง:
                    <span th:text="${booking.userId}">1</span>
                  </small>
                </div>
              </td>

              <!-- ห้องพักและสัตว์เลี้ยง -->
              <td data-detail-label="ห้องพักและสัตว์เลี้ยง">
                <div class="admin-booking-primary">
                  <strong th:text="${booking.roomName}">
                    ชื่อห้องพัก
                  </strong>

                  <small>
                    สัตว์เลี้ยง:
                    <span th:text="${booking.petNames}">
                      รายชื่อสัตว์เลี้ยง
                    </span>
                  </small>
                </div>
              </td>

              <!-- วันที่ -->
              <td data-detail-label="ช่วงวันเข้าพัก">
                <div class="admin-booking-dates">
                  <span>
                    <small>เช็กอิน</small>

                    <strong th:text="${#temporals.format(
                      booking.checkInDate,
                      'dd/MM/yyyy'
                    )}">
                      02/10/2026
                    </strong>
                  </span>

                  <span aria-hidden="true">→</span>

                  <span>
                    <small>เช็กเอาต์</small>

                    <strong th:text="${#temporals.format(
                      booking.checkOutDate,
                      'dd/MM/yyyy'
                    )}">
                      04/10/2026
                    </strong>
                  </span>
                </div>
              </td>

              <!-- สถานะการจองและการชำระเงิน -->
              <td data-detail-label="สถานะ">
                <div class="admin-booking-statuses">
                  <span class="booking-status-badge"
                        data-status-label
                        th:attr="data-status-label=${booking.status.name()}"
                        th:text="${booking.status}">
                  </span>

                  <span class="payment-status-badge"
                        data-payment-label
                        th:attr="data-payment-label=${
                          booking.paymentStatus != null
                            ? booking.paymentStatus.name()
                            : ''
                        }"
                        th:text="${booking.paymentStatus != null
                          ? booking.paymentStatus
                          : 'ไม่ระบุ'}">
                  </span>
                </div>
              </td>

              <!-- ยอดรวม -->
              <td data-detail-label="ยอดรวม">
                <strong class="admin-booking-total">
                  ฿<span th:text="${#numbers.formatDecimal(
                    booking.totalPrice,
                    1,
                    'COMMA',
                    2,
                    'POINT'
                  )}">
                    0.00
                  </span>
                </strong>
              </td>

              <!-- ปุ่มดำเนินการ -->
              <td data-detail-label="ดำเนินการ">
                <div class="admin-booking-actions">

                  <button type="button"
                          class="btn btn-small"
                          data-show-details
                          hidden>
                    ดูรายละเอียด
                  </button>

                  <a class="btn btn-small"
                    th:if="${booking.paymentStatus != null
                      and booking.paymentStatus.name() == 'PAID'}"
                    th:href="@{/bookings/{id}/receipt(
                      id=${booking.id}
                    )}">
                    ดูใบเสร็จ
                  </a>

                  <form method="post"
                        th:if="${booking.status.name() == 'PENDING'}"
                        th:action="@{/admin/bookings/{id}/confirm(
                          id=${booking.id}
                        )}"
                        data-confirm="ยืนยันการจองนี้หรือไม่?">

                    <button type="submit"
                            class="btn btn-small btn-primary">
                      ยืนยันการจอง
                    </button>
                  </form>

                  <form method="post"
                        th:if="${booking.status.name() == 'CONFIRMED'}"
                        th:action="@{/admin/bookings/{id}/check-in(
                          id=${booking.id}
                        )}"
                        data-confirm="ยืนยันเช็กอินการจองนี้หรือไม่?">

                    <button type="submit"
                            class="btn btn-small btn-primary">
                      เช็กอิน
                    </button>
                  </form>

                  <form method="post"
                        th:if="${booking.status.name() == 'CHECKED_IN'}"
                        th:action="@{/admin/bookings/{id}/check-out(
                          id=${booking.id}
                        )}"
                        data-confirm="ยืนยันเช็กเอาต์การจองนี้หรือไม่?">

                    <button type="submit"
                            class="btn btn-small btn-primary">
                      เช็กเอาต์
                    </button>
                  </form>

                  <form method="post"
                        th:if="${booking.paymentStatus != null
                          and booking.paymentStatus.name() == 'UNPAID'
                          and (booking.status.name() == 'PENDING'
                            or booking.status.name() == 'CONFIRMED')}"
                        th:action="@{/admin/bookings/{id}/cancel(
                          id=${booking.id}
                        )}"
                        data-confirm="ยืนยันยกเลิกการจองนี้หรือไม่?">

                    <button type="submit"
                            class="btn btn-small btn-danger">
                      ยกเลิก
                    </button>
                  </form>

                  <form method="post"
                        th:if="${booking.paymentStatus != null
                          and booking.paymentStatus.name() == 'UNPAID'
                          and (booking.status.name() == 'CONFIRMED'
                            or booking.status.name() == 'CHECKED_IN'
                            or booking.status.name() == 'CHECKED_OUT')}"
                        th:action="@{/admin/bookings/{id}/payment/confirm(
                          id=${booking.id}
                        )}"
                        th:attr="data-confirm=${'ได้รับเงินจำนวน '
                          + booking.totalPrice
                          + ' บาทครบแล้ว และต้องการออกใบเสร็จใช่หรือไม่?'}">

                    <button type="submit"
                            class="btn btn-small btn-primary">
                      บันทึกรับเงิน
                    </button>
                  </form>

                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <p id="booking-empty"
         th:hidden="${not #lists.isEmpty(bookings)}">
        ไม่พบรายการการจอง
      </p>

      <dialog id="booking-dialog" aria-labelledby="dialog-title">
        <h2 id="dialog-title">ข้อมูลการจอง</h2>
        <p id="dialog-text" style="white-space: pre-line"></p>

        <div class="row">
          <button id="dialog-close" type="button" class="btn">ปิด</button>
          <button id="dialog-confirm" type="button"
                  class="btn btn-primary" hidden>
            ยืนยัน
          </button>
        </div>
      </dialog>
    </main>
  </div>
</body>
</html>
