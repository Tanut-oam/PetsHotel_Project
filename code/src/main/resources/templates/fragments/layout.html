<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ===== ฝั่งลูกค้า ===== -->
<header class="topbar" th:fragment="topbar">
  <a class="brand" th:href="@{/}">🐾 PetsHotel</a>
  <nav class="topnav">
    <a th:href="@{/}">หน้าแรก</a>
    <a th:href="@{/rooms/available}">ห้องพัก</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/pets}">สัตว์เลี้ยง</a>
    <a sec:authorize="isAuthenticated()" th:href="@{/bookings}">การจอง</a>
  </nav>
  <div class="top-actions">
    <a sec:authorize="isAnonymous()" class="btn btn-small" th:href="@{/login}">เข้าสู่ระบบ</a>
    <a sec:authorize="isAnonymous()" class="btn btn-small" th:href="@{/register}">สมัครสมาชิก</a>
    <span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="display:inline">
      <button class="btn btn-small" type="submit">ออกจากระบบ</button>
    </form>
  </div>
</header>

<aside class="sidebar" th:fragment="sidebar">
  <a th:href="@{/}">⌂ หน้าแรก</a>
  <a th:href="@{/rooms/available}">▣ ห้องพัก</a>
  <a th:href="@{/pets}">♧ สัตว์เลี้ยงของฉัน</a>
  <a th:href="@{/bookings}">▤ การจองของฉัน</a>
  <a sec:authorize="hasAnyRole('STAFF', 'ADMIN')" th:href="@{/admin/bookings}">▤ จัดการการจอง</a>
  <a th:href="@{/reports}">♡ รายงานการดูแล</a>
  <a th:href="@{/profile}">♙ บัญชีของฉัน</a>
</aside>

<!-- ===== ฝั่งแอดมิน ===== -->
<header class="topbar" th:fragment="admin-topbar">
  <a class="brand" th:href="@{/admin}">🐾 PetsHotel Admin</a>
  <div class="top-actions">
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button class="btn btn-small" type="submit">ออกจากระบบ</button>
    </form>
  </div>
</header>

<aside class="sidebar" th:fragment="admin-sidebar">
  <a th:href="@{/admin}">▦ ภาพรวม</a>
  <a th:href="@{/admin/bookings}">▤ จัดการการจอง</a>
  <a th:href="@{/rooms}">▣ จัดการห้องพัก</a>
  <a th:href="@{/admin/pets}">♧ สัตว์เลี้ยง</a>
  <a th:href="@{/admin/services}">✿ บริการเสริม</a>
  <a th:href="@{/admin/promotions}">◇ โปรโมชัน</a>
  <a th:href="@{/admin/reports}">▤ รายงานการดูแล</a>
  <a th:href="@{/admin/users}">♙ สมาชิก</a>
</aside>

</body>
</html>
