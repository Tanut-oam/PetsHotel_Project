<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/pet.css}">
</head>
<body>
  <header th:replace="~{fragments/layout :: topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>สัตว์เลี้ยงของฉัน</h1>
        <button class="btn btn-primary"
        type="button"
        id="add-pet-button"
        aria-haspopup="dialog"
        aria-controls="pet-create-dialog">+ เพิ่มสัตว์เลี้ยง</button>
      </div>
      <div class="panel"
          th:if="${editMessage}"
          th:text="${editMessage}"
          role="status"></div>
      <div class="panel" th:if="${#lists.isEmpty(pets)}">
        ยังไม่มีสัตว์เลี้ยงในบัญชีของคุณ
      </div>

      <div class="grid cols-2" th:unless="${#lists.isEmpty(pets)}">
        <article class="panel" th:each="pet : ${pets}">
          <div class="pet-row">
            <span aria-hidden="true" style="font-size: 2rem;">🐾</span>
            <div>
              <h3 th:text="${pet.name}">ชื่อสัตว์เลี้ยง</h3>

              <p class="muted">
                <span th:switch="${pet.type.name()}">
                  <span th:case="'DOG'">สุนัข</span>
                  <span th:case="'CAT'">แมว</span>
                  <span th:case="*">สัตว์ชนิดอื่น</span>
                </span>
                <span th:if="${!#strings.isEmpty(pet.breed)}"
                      th:text="| · ${pet.breed}|"></span>
                <span th:if="${pet.age != null}"
                      th:text="| · อายุ ${pet.age} ปี|"></span>
                <span th:if="${pet.weight != null}"
                      th:text="| · ${pet.weight} กก.|"></span>
              </p>
            </div>
          </div>

          <p>
            ข้อควรระวัง:
            <span th:text="${#strings.isEmpty(pet.medicalNote) ? 'ไม่มี' : pet.medicalNote}">
              ไม่มี
            </span>
          </p>

                    <div class="row">
            <button class="btn btn-small pet-edit-button"
                    type="button"
                    th:attr="data-dialog-id=|pet-edit-dialog-${pet.id}|"
                    aria-haspopup="dialog">แก้ไข</button>
            <button class="btn btn-small btn-danger" type="button">ลบ</button>
          </div>

          <dialog class="pet-dialog pet-edit-dialog"
                  th:id="|pet-edit-dialog-${pet.id}|"
                  th:attr="aria-labelledby=|pet-edit-heading-${pet.id}|">
            <div class="section-title">
              <h2 th:id="|pet-edit-heading-${pet.id}|">แก้ไขสัตว์เลี้ยง</h2>
              <button class="btn btn-small pet-edit-close"
                      type="button">ปิด</button>
            </div>

            <div class="panel"
                 th:if="${editPetId == pet.id and editError != null}"
                 th:text="${editError}"
                 data-edit-feedback
                 tabindex="-1"></div>

            <form class="panel grid cols-2"
                  th:action="@{/pets/{petId}/edit(petId=${pet.id})}"
                  method="post">
              <label class="field">
                ชื่อ
                <input name="name" th:value="${pet.name}" required>
              </label>

              <label class="field">
                ประเภท
                <select name="type" required>
                  <option value="DOG"
                          th:selected="${pet.type.name() == 'DOG'}">สุนัข</option>
                  <option value="CAT"
                          th:selected="${pet.type.name() == 'CAT'}">แมว</option>
                  <option value="OTHER"
                          th:selected="${pet.type.name() == 'OTHER'}">สัตว์ชนิดอื่น</option>
                </select>
              </label>

              <label class="field">
                สายพันธุ์
                <input name="breed" th:value="${pet.breed}">
              </label>

              <label class="field">
                อายุ (ปี)
                <input type="number" name="age" min="0"
                       th:value="${pet.age}">
              </label>

              <label class="field">
                น้ำหนัก (กก.)
                <input type="number" name="weight" min="0.01" step="any"
                       th:value="${pet.weight}">
              </label>

              <label class="field">
                เพศ
                <select name="gender">
                  <option value=""
                          th:selected="${#strings.isEmpty(pet.gender)}">ไม่ระบุ</option>
                  <option value="MALE"
                          th:selected="${pet.gender == 'MALE'}">เพศผู้</option>
                  <option value="FEMALE"
                          th:selected="${pet.gender == 'FEMALE'}">เพศเมีย</option>
                </select>
              </label>

              <label class="field">
                ข้อควรระวัง/โรคประจำตัว
                <textarea name="medicalNote"
                          th:text="${pet.medicalNote}"></textarea>
              </label>

              <label class="field">
                คำแนะนำการให้อาหาร
                <textarea name="feedingInstruction"
                          th:text="${pet.feedingInstruction}"></textarea>
              </label>

              <label class="field">
                หมายเหตุเพิ่มเติม
                <textarea name="specialNote"
                          th:text="${pet.specialNote}"></textarea>
              </label>

              <div>
                <button class="btn btn-primary" type="submit">
                  บันทึกการแก้ไข
                </button>
              </div>
            </form>
          </dialog>
        </article>
      </div>

        <dialog id="pet-create-dialog"
            class="pet-dialog"
            aria-labelledby="pet-create-heading">
      <div class="section-title">
        <h2 id="pet-create-heading">เพิ่มสัตว์เลี้ยง</h2>
        <button class="btn btn-small"
                type="button"
                id="close-pet-dialog">ปิด</button>
      </div>

        <div class="panel"
             th:if="${message}"
             th:text="${message}"
             data-pet-feedback></div>

        <div class="panel"
             th:if="${error}"
             th:text="${error}"
             data-pet-feedback></div>

        <form class="panel grid cols-2"
              id="pet-form"
              th:action="@{/pets}"
              method="post">
          <label class="field">
            ชื่อ
            <input name="name" required>
          </label>

          <label class="field">
            ประเภท
            <select name="type" required>
              <option value="DOG">สุนัข</option>
              <option value="CAT">แมว</option>
              <option value="OTHER">สัตว์ชนิดอื่น</option>
            </select>
          </label>

          <label class="field">
            สายพันธุ์
            <input name="breed">
          </label>

          <label class="field">
            อายุ (ปี)
            <input type="number" name="age" min="0">
          </label>

          <label class="field">
            น้ำหนัก (กก.)
            <input type="number" name="weight" min="0.01" step="any">
          </label>

          <label class="field">
            รูปภาพ
            <input type="file" name="photo" accept="image/*" disabled>
            <small>ยังไม่รองรับการอัปโหลดรูปภาพ</small>
          </label>

          <label class="field">
            เพศ
            <select name="gender">
              <option value="">ไม่ระบุ</option>
              <option value="MALE">เพศผู้</option>
              <option value="FEMALE">เพศเมีย</option>
            </select>
          </label>

          <label class="field">
            ข้อควรระวัง/โรคประจำตัว
            <textarea name="medicalNote"></textarea>
          </label>

          <label class="field">
            คำแนะนำการให้อาหาร
            <textarea name="feedingInstruction"></textarea>
          </label>

          <label class="field">
            หมายเหตุเพิ่มเติม
            <textarea name="specialNote"></textarea>
          </label>

          <div>
            <button class="btn btn-primary" type="submit">บันทึกข้อมูล</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>

  <footer class="footer">PetsHotel · บ้านหลังที่สองของเพื่อนตัวโปรด</footer>
  <script th:src="@{/js/pets.js}" defer></script>
</body>
</html>
