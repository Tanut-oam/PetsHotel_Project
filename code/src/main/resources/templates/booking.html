<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สร้างการจอง · PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script defer th:src="@{/js/booking-form.js}"></script>
</head>
<body>
  <header th:replace="~{fragments/layout :: topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
      <h1>สร้างการจอง</h1>

      <form id="booking-form"
            class="panel"
            method="post"
            th:action="@{/bookings}"
            th:object="${bookingForm}">

        <div th:if="${#fields.hasAnyErrors()}" role="alert">
          <p>ยังสร้างการจองไม่ได้ กรุณาตรวจสอบข้อมูล</p>
          <ul>
            <li th:each="error : ${#fields.allErrors()}"
                th:text="${error}"></li>
          </ul>
        </div>

        <p id="booking-error" role="alert" hidden></p>

        <label class="field">
          ห้องพัก
          <select id="room-id" th:field="*{roomId}" required>
            <option value="">เลือกห้องพัก</option>

            <option th:each="room : ${rooms}"
                    th:value="${room.id}"
                    th:text="${room.name + ' · สูงสุด ' + room.capacity + ' ตัว'}"
                    th:attr="data-capacity=${room.capacity}">
            </option>
          </select>
        </label>

        <label class="field">
          วันเช็กอิน
          <input id="check-in"
                 type="date"
                 th:field="*{checkInDate}"
                 required>
        </label>

        <label class="field">
          วันเช็กเอาต์
          <input id="check-out"
                 type="date"
                 th:field="*{checkOutDate}"
                 required>
        </label>

        <fieldset>
          <legend>สัตว์เลี้ยงของฉัน</legend>

          <p th:if="${#lists.isEmpty(pets)}">
            ยังไม่มีสัตว์เลี้ยงที่เลือกได้
            <a th:href="@{/pets}">ไปเพิ่มสัตว์เลี้ยง</a>
          </p>

          <label th:each="pet : ${pets}" class="field">
            <input type="checkbox"
                   th:field="*{petIds}"
                   th:value="${pet.id}">
            <span th:text="${pet.name}"></span>
          </label>
        </fieldset>

        <fieldset>
          <legend>บริการเสริม</legend>
          <p>ใส่ 0 หากไม่ต้องการบริการนั้น</p>

          <label th:each="service : ${extraServices}" class="field">
            <span th:text="${service.name}"></span>
            <span th:text="${'ราคา ' + service.price + ' บาท/หน่วย'}"></span>

            <input type="number"
                   min="0"
                   step="1"
                   required
                   data-service-quantity
                   th:field="*{extraServiceQuantities[__${service.id}__]}">
          </label>
        </fieldset>

        <label class="field">
          โปรโมชั่น
          <select th:field="*{promotionId}">
            <option value="">ไม่ใช้โปรโมชั่น</option>
            <option th:each="promotion : ${promotions}"
                    th:value="${promotion.id}"
                    th:text="${promotion.name}">
            </option>
          </select>
        </label>

        <p id="booking-summary" role="status"></p>

        <p>
          ระบบจะตรวจสอบห้องว่าง เงื่อนไขโปรโมชั่น
          และคำนวณยอดเมื่อสร้างการจอง
        </p>

        <button type="submit" class="btn">สร้างการจอง</button>
        <a class="btn" th:href="@{/bookings}">กลับรายการของฉัน</a>
      </form>
    </main>
  </div>
</body>
</html>
