<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บัญชีของฉัน | PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body th:classappend="${#authorization.expression('hasRole(''ADMIN'')')} ? 'admin'">
  <header th:replace="${#authorization.expression('hasRole(''ADMIN'')')} ? ~{fragments/layout :: admin-topbar} : ~{fragments/layout :: topbar}"></header>

  <div class="layout">
    <aside th:replace="${#authorization.expression('hasRole(''ADMIN'')')} ? ~{fragments/layout :: admin-sidebar} : ~{fragments/layout :: sidebar}"></aside>

    <main class="content">
      <h1>บัญชีของฉัน</h1>

      <section class="panel" style="max-width: 650px;">
        <div class="grid">
          <label class="field">ชื่อ
            <input th:value="${user.firstName} + ' ' + ${user.lastName}" readonly>
          </label>
          <label class="field">อีเมล
            <input type="email" th:value="${user.email}" readonly>
          </label>
          <label class="field">เบอร์โทร
            <input type="tel" th:value="${user.phoneNumber}" readonly>
          </label>
        </div>
      </section>
    </main>
  </div>
  <footer class="footer">PetsHotel · บ้านหลังที่สองของเพื่อนตัวโปรด</footer>
</body>
</html>
