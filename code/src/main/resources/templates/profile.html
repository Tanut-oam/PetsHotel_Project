<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บัญชีของฉัน | PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body th:classappend="${#authorization.expression('hasRole(''ADMIN'')')} ? 'admin'">
  <header th:replace="${#authorization.expression('hasRole(''ADMIN'')')} ? ~{fragments/layout :: admin-topbar} : ~{fragments/layout :: topbar}"></header>

  <div class="layout">
    <aside th:replace="${#authorization.expression('hasRole(''ADMIN'')')} ? ~{fragments/layout :: admin-sidebar} : ~{fragments/layout :: sidebar}"></aside>

    <main class="content">
      <h1>บัญชีของฉัน</h1>

      <section class="panel" style="max-width: 650px;">
        <div class="grid">
          <label class="field">ชื่อ
            <input th:value="${user.firstName} + ' ' + ${user.lastName}" readonly>
          </label>
          <label class="field">อีเมล
            <input type="email" th:value="${user.email}" readonly>
          </label>
          <label class="field">เบอร์โทร
            <input type="tel" th:value="${user.phoneNumber}" readonly>
          </label>
        </div>
      </section>
            <section class="panel" style="max-width: 650px; margin-top: 18px;">
        <h2>ออกจากระบบ</h2>
        <p class="muted">ออกจากบัญชีนี้บนอุปกรณ์นี้</p>
        <button class="btn btn-danger" type="button" data-open-logout>ออกจากระบบ</button>
      </section>

      <dialog id="logout-dialog"
              class="admin-form-dialog"
              style="width: min(440px, calc(100% - 32px));"
              aria-labelledby="logout-title">
        <form class="admin-dialog-form" th:action="@{/logout}" method="post">
          <h2 id="logout-title">ยืนยันการออกจากระบบ</h2>
          <p class="muted">ต้องการออกจากระบบใช่ไหม?</p>

          <div class="admin-dialog-actions">
            <button class="btn" type="button" data-close-logout>ยกเลิก</button>
            <button class="btn btn-danger" type="submit">ออกจากระบบ</button>
          </div>
        </form>
      </dialog>
    </main>
  </div>
  <footer class="footer">PetsHotel · บ้านหลังที่สองของเพื่อนตัวโปรด</footer>
  <script th:src="@{/js/logout-confirm.js}" defer></script>
  </body>
</html>
