<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แก้ไขห้องพัก | PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>
          แก้ไขห้อง
          <span th:text="${room.roomNumber}">A101</span>
        </h1>

        <a class="btn" th:href="@{/admin/rooms}">
          กลับหน้าจัดการห้องพัก
        </a>
      </div>

      <form class="panel grid cols-2"
            th:action="@{/admin/rooms/{id}(id=${room.id})}"
            method="post">

        <label class="field">
          เลขห้อง
          <input type="text"
                 name="roomNumber"
                 th:value="${room.roomNumber}"
                 required>
        </label>

        <label class="field">
          ชื่อห้อง
          <input type="text"
                 name="name"
                 th:value="${room.name}"
                 required>
        </label>

        <label class="field" style="grid-column:1 / -1">
          รายละเอียด
          <textarea name="description"
                    th:text="${room.description}"></textarea>
        </label>

        <label class="field">
          รับได้ (ตัว)
          <input type="number"
                 name="capacity"
                 min="1"
                 step="1"
                 th:value="${room.capacity}"
                 required>
        </label>

        <label class="field">
          ราคา/ตัว/คืน (บาท)
          <input type="number"
                 name="pricePerPetPerNight"
                 min="0"
                 step="0.01"
                 th:value="${room.pricePerPetPerNight}"
                 required>
        </label>

        <div style="grid-column:1 / -1">
          <button class="btn btn-primary" type="submit">
            บันทึกการแก้ไข
          </button>

          <a class="btn" th:href="@{/admin/rooms}">
            ยกเลิก
          </a>
        </div>
      </form>

      <form th:action="@{/admin/rooms/{id}/deactivate(id=${room.id})}"
            method="post"
            style="margin-top:20px">
        <button class="btn btn-danger"
                type="submit"
                th:disabled="${room.status.name() == 'INACTIVE'}">
          ปิดใช้งานห้องนี้
        </button>
      </form>
    </main>
  </div>
</body>
</html>
