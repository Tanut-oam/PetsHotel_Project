<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แก้ไขห้องพัก | PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <main class="content">
    <section class="panel" style="max-width: 520px; margin: 24px auto;">
      <h1>แก้ไขห้อง <span th:text="${room.roomNumber}">A101</span></h1>
      <form th:action="@{/rooms/{id}(id=${room.id})}" method="post">
        <label class="field">เลขห้อง<input type="text" name="roomNumber" th:value="${room.roomNumber}" required></label>
        <label class="field">ชื่อห้อง<input type="text" name="name" th:value="${room.name}" required></label>
        <label class="field">รายละเอียด<textarea name="description" th:text="${room.description}"></textarea></label>
        <label class="field">รับได้ (ตัว)<input type="number" name="capacity" min="1" th:value="${room.capacity}" required></label>
        <label class="field">ราคา/ตัว/คืน (บาท)<input type="number" name="pricePerPetPerNight" min="0" step="0.01" th:value="${room.pricePerPetPerNight}" required></label>
        <button class="btn btn-primary" type="submit">บันทึก</button>
        <a class="btn" th:href="@{/rooms}">ยกเลิก</a>
      </form>

      <form th:action="@{/rooms/{id}/deactivate(id=${room.id})}" method="post" style="margin-top: 16px;">
        <button class="btn btn-danger" type="submit">ปิดใช้งานห้องนี้</button>
      </form>
    </section>
  </main>
</body>
</html>
