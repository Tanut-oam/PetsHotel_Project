<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เพิ่มห้องพัก | PetsHotel Admin</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body class="admin">
  <header th:replace="~{fragments/layout :: admin-topbar}"></header>

  <div class="layout">
    <aside th:replace="~{fragments/layout :: admin-sidebar}"></aside>

    <main class="content">
      <div class="section-title">
        <h1>เพิ่มห้องพัก</h1>
        <a class="btn" th:href="@{/admin/rooms}">
          กลับหน้าจัดการห้องพัก
        </a>
      </div>
      <div th:if="${error}"
          class="flash-notice flash-error"
          role="alert">
        <span class="flash-icon" aria-hidden="true">!</span>
        <span th:text="${error}"></span>
      </div>

      <form class="panel grid cols-2"
            th:action="@{/admin/rooms}"
            method="post"
            enctype="multipart/form-data">

        <label class="field">
          เลขห้อง
          <input type="text"
                name="roomNumber"
                required>
        </label>

        <label class="field">
          ชื่อห้อง
          <input type="text"
                name="name"
                required>
        </label>

        <label class="field" style="grid-column:1 / -1">
          รายละเอียด
          <textarea name="description"></textarea>
        </label>

        <label class="field" style="grid-column:1 / -1">
          รูปห้อง (ไม่บังคับ · JPG/PNG ไม่เกิน 5 MB)
          <input type="file"
                name="image"
                accept="image/jpeg,image/png">
        </label>

        <label class="field">
          รับได้ (ตัว)
          <input type="number"
                name="capacity"
                min="1"
                step="1"
                required>
        </label>

        <label class="field">
          ราคา/ตัว/คืน (บาท)
          <input type="number"
                name="pricePerPetPerNight"
                min="0"
                step="0.01"
                required>
        </label>

        <div style="grid-column:1 / -1">
          <button class="btn btn-primary" type="submit">
            บันทึก
          </button>

          <a class="btn" th:href="@{/admin/rooms}">
            ยกเลิก
          </a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
