<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เพิ่มห้องพัก | PetsHotel</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <main class="content">
    <section class="panel" style="max-width: 520px; margin: 24px auto;">
      <h1>เพิ่มห้องพัก</h1>
      <form th:action="@{/rooms}" method="post">
        <label class="field">เลขห้อง<input type="text" name="roomNumber" required></label>
        <label class="field">ชื่อห้อง<input type="text" name="name" required></label>
        <label class="field">รายละเอียด<textarea name="description"></textarea></label>
        <label class="field">รับได้ (ตัว)<input type="number" name="capacity" min="1" required></label>
        <label class="field">ราคา/ตัว/คืน (บาท)<input type="number" name="pricePerPetPerNight" min="0" step="0.01" required></label>
        <button class="btn btn-primary" type="submit">บันทึก</button>
        <a class="btn" th:href="@{/rooms}">ยกเลิก</a>
      </form>
    </section>
  </main>
</body>
</html>
